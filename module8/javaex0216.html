<!-- ノート機能実装のためのサンプル-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

</head>    
<body>
    <section class="container">
        <section class = "card">
            <section class="card-header">
            </section>
            <section id ="c_body" class="card-body">
                <div class="row justify-content-center g-0">
                   <div class="btn-group col-8">
                        <input type="radio" class="btn-check" name="btnradio" id="btnradio1" checked onclick = "changeLineColor('black')">
                        <label class="btn btn-dark" for="btnradio1">
                            <img src ="http://mathmedia.information.jp/svg/pencil-fill.svg" alt="鉛筆"></img> 
                        </label>
                  
                        <input type="radio" class="btn-check" name="btnradio" id="btnradio2" onclick = "changeLineColor('red')">
                        <label class="btn btn-danger" for="btnradio2">
                            <img src ="http://mathmedia.information.jp/svg/pencil-fill.svg" alt="鉛筆"></img> 
                        </label>
                  
                        <input type="radio" class="btn-check" name="btnradio" id="btnradio3" onclick = "changeLineColor('blue')">
                        <label class="btn btn-primary" for="btnradio3">
                            <img src ="http://mathmedia.information.jp/svg/pencil-fill.svg" alt="鉛筆"></img> 
                        </label>
                        <input type="radio" class="btn-check" name="btnradio" id="btnradio4" onclick = "changeLineColor('white')">
                        <label class="btn btn-light" for="btnradio4">
                            <img src ="http://mathmedia.information.jp/svg/eraser-fill.svg" alt="鉛筆"></img> 
                        </label>
                    </div>
                    <button type = "button" class="btn btn-secondary col-2"  onclick="trashCanvas()"> 
                        <img src ="http://mathmedia.information.jp/svg/trash3-fill.svg" alt="ゴミ箱"></img>
                    </button>
                </div>
                <div>
                    <canvas id="mycanvas">
                    </canvas>
                </div>
                
            </section>
            
        </section>
        <div>
            タッチ(10px)未満で動作するので，Apple Pencilなどで機能します．<br>
            ただのタッチペン(ディスクタイプ)や指では機能しません<br>
            firefox(dev)では動作確認できず
        </div>
        
    </section>

    

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
<script>
    //console.dir(document.body);
    var canvas = document.getElementById("mycanvas");
    var c_body = document.getElementById("c_body");
    //c_body.style.backgroundColor ="lightgray";
    c_body.style.height="250px";//heightやmaxHeight はbootstrap と相性悪い？
    c_body.style.overflow ="scroll";//こちらはcssに反映された
   // console.dir(window);
    var card_body_padding = 16;
    console.log(c_body.clientWidth);//スクロールバーを除いた幅を返す
    canvas.width = c_body.clientWidth -2 * card_body_padding;//width - 2 * container_padding -2 * card_border - 2 * card_padding;
    canvas.height="1000";
    //canvas.style.backgroundColor="yellow";
    
    var ctx = canvas.getContext("2d");
    var request = window.indexedDB.open("math",1);
    request.onupgradeneeded =function(event){  
        var db = event.target.result; 
        var objectStore = db.createObjectStore("note", {keyPath:"mondaiID", autoIncrement:false});
    }
    var db;
    request.onsuccess = function(event){
        //alert("ok");
        db = event.target.result; 
        var transaction = db.transaction("note");
        //alert(db);
        var objectStore = transaction.objectStore("note");;
        var secondRequest = objectStore.get(1);
        secondRequest.onsuccess = function(event){
            if(event.target.result){
                var newData = event.target.result.imageData;
                ctx.putImageData(newData, 0, 0);
            }
        }
        secondRequest.onerror = function(event) {
        }
    }
    request.onerror = function(event){
    }
    canvas.addEventListener("touchstart", function(e){
       // alert(e.touches[0].radiusX);
         if (e.touches[0].radiusX < 10){
            e.preventDefault();
            ctx.beginPath();
            var x = e.touches[0].clientX - canvas.getBoundingClientRect().left;//touch オブジェクトには offset はない
            var y = e.touches[0].clientY - canvas.getBoundingClientRect().top;
            ctx.moveTo(x, y);//canvas上での座標を取得
        }
    });
    canvas.addEventListener("touchmove", function(e){//pointermoveはモバイルのブラウザではあてにならない
               if (e.touches[0].radiusX< 10){
                    
                    e.preventDefault();//これが肝心！そもそもデフォルトのアクションをしないので touchAction:noneは不要
                
                    var x = e.touches[0].clientX - canvas.getBoundingClientRect().left;
                    var y = e.touches[0].clientY - canvas.getBoundingClientRect().top;
                    
                    ctx.lineTo(x,y);
                    ctx.stroke();
                    ctx.beginPath();//パスの一体化を防ぐために以下の２行をいれたほうがよい？
                    ctx.moveTo(x, y);
                 }
    });
    canvas.addEventListener("touchend", function(event){//pointermoveはモバイルのブラウザではあてにならない
        //alert(event.touches[0]);//touchend 発火の際にはtouches[0]は undefined
        //if (event.touches[0].radiusX < 10){ 指やペンなどが離れた際に記録する
            event.preventDefault();
            var data = ctx.getImageData(0,0,500,500);
            data.mondaiID = 1;//イメージデータオブジェクトに直接キーパスを書き込むとputできない
            console.dir(data);
            var obj = db.transaction("note", "readwrite");
            var obj2 = obj.objectStore("note");
             //このとき，トランザクションオブジェクト obj は　のオブジェクトストアオブジェクトの
             //transaction プロパティに組み込まれる？
            //var writeData ={mondaiID:1, imageData:data};
            obj2.put({mondaiID:1, imageData:data});
           // ctx.beginPath();
        //}
   });
   function changeLineColor(color){
       //black, blue, red の場合通常の上塗りモード
       ctx.globalCompositeOperation = "source-over";
       ctx.lineWidth = 1;
       ctx.strokeStyle = color;
       if (color === 'white'){
            ctx.lineWidth = 10;
            ctx.strokeStyle = "rgba(0, 0, 0, 1)";//完全に透明(色は黒)で塗る，ラインに重なった部分は背景が透けて見える
            ctx.globalCompositeOperation = "destination-out";
       }
   }
   function trashCanvas(){
       if ( confirm("ノートを消去してもよろしいですか") ){//ゴミ箱をクリックしたら上書きで，すべてを白紙にもどす
            
            ctx.save();//それ以前の描画スタイルの保存
       
            ctx.globalCompositeOperation = "copy";//新たな図形だけが描かれて、描画先 Canvas の内容は透明になります。
            ctx.fillStyle = "rgba(0, 0, 0, 0)";//色は完全に透明(の黒)
            ctx.fillRect(0, 0, canvas.width, canvas.height);//長方形を上書き
            var data = ctx.getImageData(0,0,500,500);
            ctx.restore();//以前の描画状態にもどす

            var obj = db.transaction("note", "readwrite");
            var obj2 = obj.objectStore("note");
        //このとき，トランザクションオブジェクト obj は　のオブジェクトストアオブジェクトの
             //transaction プロパティに組み込まれる？
            //var writeData ={mondaiID:1, imageData:data};
            var request = obj2.put({mondaiID:1, imageData:data});
                request.onsuccess = function(e){
                    console.dir(e);
                }
                request.onerror = function(e){
                    console.dir(e);
                }
        }
    }

        var x = event.clientX - canvas.getBoundingClientRect().left;//touch オブジェクトには offset はない
        var y = event.clientY - canvas.getBoundingClientRect().top;   
        //ctx.moveTo(event.offsetX, event.offsetY);//マウスイベントはこちらでも
        ctx.moveTo(x, y);
    });
    canvas.addEventListener("mouseup", function(event){
            event.preventDefault();
            ctx.lineTo(event.offsetX, event.offsetY);
            ctx.stroke();
            var data = ctx.getImageData(0,0,500,500);
            data.mondaiID = 1;//イメージデータオブジェクトに直接キーパスを書き込むとputできない
            //console.dir(data);
            var obj = db.transaction("note", "readwrite");
            var obj2 = obj.objectStore("note");
            obj2.put({mondaiID:1, imageData:data});
            ctx.beginPath();
   });
   */
</script>
</body>
</html>
